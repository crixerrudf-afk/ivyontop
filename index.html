<!DOCTYPE html>
<html>
<head>
<title>Colorful Hearts Flower Animation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:linear-gradient(#000000,#160018);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* HEARTS CONTAINER */
.hearts{
    position:absolute;
    width:100%;
    height:100%;
}


/* HEART DESIGN */
.heart{
    position:absolute;
    width:50px;
    height:50px;
    background:red;
    transform:rotate(-45deg);
    animation:beat 1.5s infinite, float 8s infinite;
    box-shadow:0 0 25px currentColor;
}


.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:50px;
    height:50px;
    background:inherit;
    border-radius:50%;
}


.heart:before{
    top:-25px;
    left:0;
}


.heart:after{
    left:25px;
    top:0;
}


/* HEART BEAT */
@keyframes beat{

    0%,100%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.3);
    }

}


/* FLOATING */
@keyframes float{

    from{
        bottom:-100px;
    }

    to{
        bottom:110%;
    }

}


/* COLORS + POSITIONS */

.h1{
    left:10%;
    color:#ff1744;
    background:#ff1744;
    animation-delay:0s;
}

.h2{
    left:30%;
    color:#ff9800;
    background:#ff9800;
    animation-delay:1s;
}

.h3{
    left:50%;
    color:#00e5ff;
    background:#00e5ff;
    animation-delay:2s;
}

.h4{
    left:70%;
    color:#76ff03;
    background:#76ff03;
    animation-delay:3s;
}

.h5{
    left:85%;
    color:#e040fb;
    background:#e040fb;
    animation-delay:4s;
}


/* FLOWERS */

.flower{
    position:absolute;
    font-size:80px;
    animation:rotate 6s infinite linear;
}


.f1{
    bottom:50px;
    left:10%;
}

.f2{
    bottom:40px;
    right:15%;
}


@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* TITLE */

h1{
    color:white;
    font-family:Arial;
    font-size:35px;
    text-shadow:0 0 20px pink;
    z-index:5;
}

</style>

</head>


<body>


<h1>❤️ I LOVE YOU MY IVY ❤️</h1>


<div class="hearts">

<div class="heart h1"></div>
<div class="heart h2"></div>
<div class="heart h3"></div>
<div class="heart h4"></div>
<div class="heart h5"></div>

</div>


<div class="flower f1">🌸</div>
<div class="flower f2">🌺</div>


</body>
</html>
